services:
  postgres:
    image: postgres:16-alpine
    container_name: user_db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postrgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - energy_tracker_net

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-api
    restart: unless-stopped
    env_file:
      - ./user-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - energy_tracker_net

  device-service:
    build:
      context: ./device-service
      dockerfile: Dockerfile
    container_name: device-api
    restart: unless-stopped
    env_file:
      - ./device-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"
    networks:
      - energy_tracker_net

volumes:
  pgdata:

networks:
  energy_tracker_net: